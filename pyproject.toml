[project]
name = "sentinel-ph"
version = "0.1.0"
description = "Multi-agent dengue intelligence platform for the Philippines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Reynaldo Ace Pilpil" }]

dependencies = [
    # LLM framework & orchestration
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-community>=0.3",
    "langchain-groq>=0.2",
    "langchain-chroma>=0.1",
    "langchain-huggingface>=0.1",
    # Vector store & embeddings
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    # Data processing
    "pandas>=2.2",
    "polars>=1.0",
    # PDF parsing
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    # Web / scraping
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "playwright>=1.44",
    # ML / risk model
    "xgboost>=2.0",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    # Dashboard & visualization
    "streamlit>=1.35",
    "folium>=0.17",
    "plotly>=5.22",
    # Scheduling & config
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    # Google Trends
    "pytrends>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
